spring:
  application:
    name: sales
  datasource:
    url: jdbc:mysql://localhost:3306/sales
    username: sales
    password: sales
  flyway:
    # 마이그레이션 폴더 이름을 잘못 만들면 조용히 넘어가지 않고 바로 실패한다
    fail-on-missing-locations: true
  jpa:
    hibernate:
      # 테이블은 Flyway가 만든다. Hibernate는 엔티티와 테이블이 맞는지 확인만 한다
      ddl-auto: validate
    # 요청이 끝날 때까지 DB 커넥션을 쥐고 있지 않는다. 다른 서비스를 부르는 동안 커넥션을 붙잡으면 안 된다
    open-in-view: false
    properties:
      # 시각은 UTC로 저장한다. inventory 원장과 같은 기준이다
      hibernate.jdbc.time_zone: UTC
  http:
    serviceclient:
      # InventoryClientConfig의 group 이름과 같아야 한다
      inventory:
        base-url: http://localhost:8081
        connect-timeout: 1s
        read-timeout: 2s
        default-header:
          # inventory 원장에 처리자로 남는다
          X-User-Id: sales
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: sales
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
management:
  tracing:
    baggage:
      # 사용자 ID를 trace와 함께 다음 서비스로 넘긴다. 헤더 이름 그대로 오간다
      remote-fields: X-User-Id
      # 로그에 찍을 수 있게 MDC에도 넣는다
      correlation:
        fields: X-User-Id
logging:
  pattern:
    # 서비스를 건너 한 요청을 따라갈 수 있게 trace_id, span_id, 사용자 ID를 줄마다 찍는다
    correlation: "[%X{traceId:-},%X{spanId:-},%X{X-User-Id:-}] "
server:
  port: 8082
