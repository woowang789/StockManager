spring:
  application:
    name: product
  datasource:
    url: jdbc:mysql://localhost:3306/product
    username: product
    password: product
  flyway:
    # 마이그레이션 폴더 이름을 잘못 만들면 조용히 넘어가지 않고 바로 실패한다
    fail-on-missing-locations: true
  jpa:
    hibernate:
      # 테이블은 Flyway가 만든다. Hibernate는 엔티티와 테이블이 맞는지 확인만 한다
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
management:
  tracing:
    baggage:
      # 사용자 ID를 trace와 함께 다음 서비스로 넘긴다. 헤더 이름 그대로 오간다
      remote-fields: X-User-Id
      # 로그에 찍을 수 있게 MDC에도 넣는다
      correlation:
        fields: X-User-Id
logging:
  pattern:
    # 서비스를 건너 한 요청을 따라갈 수 있게 trace_id, span_id, 사용자 ID를 줄마다 찍는다
    correlation: "[%X{traceId:-},%X{spanId:-},%X{X-User-Id:-}] "
server:
  port: 8084
