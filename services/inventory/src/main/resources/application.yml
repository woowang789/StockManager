spring:
  application:
    name: inventory
  datasource:
    url: jdbc:mysql://localhost:3306/inventory
    username: inventory
    password: inventory
  flyway:
    # 마이그레이션 폴더 이름을 잘못 만들면 조용히 넘어가지 않고 바로 실패한다
    fail-on-missing-locations: true
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      # 받은 레코드의 traceparent로 이벤트를 보낸 요청의 trace를 이어받는다
      observation-enabled: true
    consumer:
      group-id: inventory
      # 진도 기록이 없을 때(처음 뜰 때)만 쓰인다. 켜지기 전에 쌓인 이벤트를 놓치지 않는다
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
management:
  tracing:
    baggage:
      # 사용자 ID를 trace와 함께 다음 서비스로 넘긴다. 헤더 이름 그대로 오간다
      remote-fields: X-User-Id
      # 로그에 찍을 수 있게 MDC에도 넣는다
      correlation:
        fields: X-User-Id
logging:
  pattern:
    # 서비스를 건너 한 요청을 따라갈 수 있게 trace_id, span_id, 사용자 ID를 줄마다 찍는다
    correlation: "[%X{traceId:-},%X{spanId:-},%X{X-User-Id:-}] "
server:
  port: 8081
