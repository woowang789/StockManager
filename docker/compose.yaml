name: stock-manager

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 서비스마다 DB와 계정을 만드는 스크립트. 서비스를 추가하면 이 폴더에 파일을 하나 추가한다.
      # 데이터 볼륨이 비어 있을 때(처음 뜰 때)만, 파일 이름 순서대로 실행된다
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # localhost는 소켓으로 붙어서, 처음 초기화할 때 잠깐 뜨는 임시 서버에도 성공한다.
      # 127.0.0.1(TCP)로 확인해야 앱이 실제로 붙을 수 있을 때 healthy가 된다.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.2.1
    ports:
      - "9092:9092"
    environment:
      # 브로커 하나가 컨트롤러도 겸한다(KRaft). 주키퍼는 쓰지 않는다
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # 클라이언트가 접속한 뒤 실제로 연결할 주소다. 컨테이너 밖에서 붙으므로 localhost로 알려 준다
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # 브로커가 하나뿐이라 내부 토픽도 복제본을 1로 둔다
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
