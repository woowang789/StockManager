[versions]
spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"
# Boot BOM이 관리하지 않아 버전을 직접 적는다. 4.x는 아직 베타라 3.x 안정판을 쓴다
wiremock = "3.13.2"
# 스프링 부트 4용 스타터가 아직 없어서 서킷브레이커 모듈만 직접 가져온다
resilience4j = "2.3.0"

[libraries]
# build-logic에서 쓰는 Gradle 플러그인
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-dependency-management-gradle-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "spring-dependency-management" }

# 공통 라이브러리 모듈이 Spring Boot BOM을 가져올 때 쓴다
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

# 아래 라이브러리 버전은 Spring Boot BOM이 정한다
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient" }
spring-boot-starter-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka" }
spring-webmvc = { module = "org.springframework:spring-webmvc" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql" }
mysql-connector-j = { module = "com.mysql:mysql-connector-j" }

spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
testcontainers-mysql = { module = "org.testcontainers:testcontainers-mysql" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka" }
resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker", version.ref = "resilience4j" }
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
